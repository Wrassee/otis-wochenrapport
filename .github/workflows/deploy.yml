name: CI/CD — Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ─── Frontend: TypeScript check + build ───
  frontend:
    name: Frontend (TypeScript + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # npm run build runs: tsc -b && vite build (includes type-check)
      - name: Build (TypeScript + Vite + PWA)
        run: npm run build

  # ─── Backend: Python syntax + dependencies ───
  backend:
    name: Backend (Python + Uvicorn)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify imports
        run: |
          python -c "from src.excel_generator import generate_excel; from src.main import app; print('All imports OK')"

  # ─── Deploy: Vercel (frontend) ───
  # IMPORTANT: Vercel project Root Directory must be set to '/' (repo root)
  # in the Vercel Dashboard. If set to 'apps/web', the path doubles
  # when working-directory is also 'apps/web' (apps/web/apps/web).
  deploy-frontend:
    name: Deploy → Vercel
    if: github.ref_name == 'main' || github.ref_name == 'master'
    needs: [frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Vercel secrets
        id: check-vercel
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "! VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID not set — skipping Vercel deploy"
            echo "  Get them: Vercel Dashboard > Account > Tokens > Create Token"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel
        if: steps.check-vercel.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Runs inside apps/web (working-directory). With Root Directory = '/'
        # in Vercel Dashboard, Vercel CLI resolves the project at CWD (apps/web)
        # without doubling the path. Framework detection works because CWD
        # contains vite.config.ts and package.json.
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  # ─── Deploy: Render (backend) via Deploy Hook ───
  #   Render provides a unique Deploy Hook URL per service.
  #   Get yours: Render Dashboard → otis-wochenrapport-api → Deploy Hooks → Create Hook
  #   Then set RENDER_DEPLOY_HOOK_URL in GitHub repo Secrets.
  deploy-backend:
    name: Deploy → Render
    if: github.ref_name == 'main' || github.ref_name == 'master'
    needs: [backend]
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "! RENDER_DEPLOY_HOOK_URL not set - skipping backend deploy"
            echo "  Get it: Render Dashboard > otis-wochenrapport-api > Deploy Hooks"
            exit 0
          fi
          echo "Triggering Render deploy..."
          HTTP_CODE=$(curl -s -o /tmp/render-response.txt -w "%{http_code}" -X POST "$HOOK_URL")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "202" ] || [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ];
          then
            echo "[OK] Render deploy triggered"
            echo "  Check: Render Dashboard > otis-wochenrapport-api > Deploys"
          else
            echo "[FAIL] Trigger failed"
            cat /tmp/render-response.txt 2>/dev/null || true
          fi

  # ─── Android: build APK + upload as Draft Release ───
  # Builds the debug APK on every push to main/master and uploads it as a
  # GitHub Draft Release (visible under Releases → Drafts until published).
  # Requires: node_modules (npm ci), the web build (cap sync copies dist),
  # JDK 21 + Android SDK (ANDROID_HOME is preconfigured on ubuntu runners;
  # local.properties stays gitignored and is NOT needed in CI).
  build-apk:
    name: Android APK — Build + Draft Release
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # npm run build runs: tsc -b && vite build (includes type-check + PWA)
      - name: Build web app (TypeScript + Vite + PWA)
        run: npm run build

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/web/android
        # chmod is NOT redundant here: gradlew is tracked with mode 100644 in
        # git (repo developed on Windows), so checkout gives it no exec bit on
        # the Linux runner — without this the build fails with Permission denied.
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Self-cleaning: remove drafts/tags from the earlier per-push scheme
      # (apk-<run_number>), keeping only the rolling apk-latest. Best-effort —
      # a cleanup hiccup must never block the draft upload.
      - name: Clean up old APK drafts (apk-*)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Listing existing apk-* drafts..."
          # Only touch DRAFTS (never a published release). The old per-push
          # scheme created drafts with tag apk-<run_number>.
          TAGS=$(gh api --paginate "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(.draft == true) | .tag_name' 2>/dev/null || true)
          for TAG in $TAGS; do
            case "$TAG" in
              apk-latest)
                echo "  keep: $TAG"
                ;;
              apk-[0-9]*)
                echo "  deleting draft $TAG (release + tag)..."
                # One call instead of release-ID + delete + ref-delete: gh
                # resolves the tag to the release, deletes it, and --cleanup-tag
                # removes the git tag too (handling the ordering internally —
                # GitHub blocks tag deletion while a release points at it).
                gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
                echo "  deleted $TAG"
                ;;
              *) ;;
            esac
          done
          echo "Cleanup done."

      # Rolling tag: apk-latest. Every build updates THE SAME draft release
      # (allowUpdates: true), so only one latest draft exists at any time
      # instead of accumulating one draft per push.
      # NOTE: publishing the draft is ONE-WAY — the tag moves with it, and the
      # next build will update that published release (the GitHub API has no
      # "unpublish" endpoint, so it can never go back to draft).
      # Old apk-<run_number> drafts are removed automatically by the
      # "Clean up old APK drafts" step above.
      - name: Create/Update Draft Release (rolling apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK Build (latest)
          body: |
            Automatikus APK build a ${{ github.ref_name }} ágra (${{ github.sha }}).

            Commit: ${{ github.event.head_commit.message || 'Manuális build (workflow_dispatch)' }}

            📱 app-debug.apk — töltsd fel a telefonra és teszteld!
            Ez egy rolling draft release (apk-latest) — minden build frissíti, így
            mindig csak a legfrissebb APK érhető el itt.
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          draft: true
          allowUpdates: true

  notify:
    name: Notify — Deploy complete
    if: always() && (github.ref_name == 'main' || github.ref_name == 'master')
    needs: [deploy-frontend, deploy-backend, build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment status
        run: |
          echo "┌─────────────────────────────────────┐"
          echo "│         Deployment Summary          │"
          echo "└─────────────────────────────────────┘"
          echo ""
          echo "📦 Frontend (Vercel): ${{ needs.deploy-frontend.result }}"
          echo "   🔗 https://otis-wochenrapport.vercel.app"
          echo ""
          echo "⚙️  Backend (Render): ${{ needs.deploy-backend.result }}"
          echo "   🔗 https://otis-wochenrapport.onrender.com/health"
          echo ""
          echo "📱 APK (Draft Release): ${{ needs.build-apk.result }}"
          echo "   🔗 GitHub → Releases → Drafts"
          echo "   Manuális build: cd apps/web && npm run build && npx cap sync android && cd android && ./gradlew assembleDebug"
